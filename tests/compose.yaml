services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local-test-only
      MYSQL_DATABASE: blog_test
    ports: ['127.0.0.1:13316:3306']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-plocal-test-only']
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:16386:6379']
    command: ['redis-server', '--requirepass', 'local-test-only']
