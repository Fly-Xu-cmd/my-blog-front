name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:local-test-only@127.0.0.1:13316/blog_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16386'
      REDIS_PASSWORD: local-test-only
      NEXT_PUBLIC_SITE_URL: https://xylxf.xyz
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/check-deploy-readiness.sh tests/check-deploy-readiness.test.sh
      - run: bash tests/check-deploy-readiness.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: bash -n scripts/deploy-release.sh tests/deploy-release.test.sh
      - run: bash tests/deploy-release.test.sh
      - name: Bootstrap private Node 24 from a Node 20 server
        run: docker run --rm -v "$PWD:/work:ro" -w /work node:20.20.0-bookworm-slim bash tests/deploy-release.test.sh
      - run: pnpm exec prisma generate
      - run: docker compose -p blog-optimization-test -f tests/compose.yaml up -d --wait
      - run: pnpm exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results
      - run: docker compose -p blog-optimization-test -f tests/compose.yaml down -v
        if: always()

