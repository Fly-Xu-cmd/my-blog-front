name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://root:local-test-only@127.0.0.1:13316/blog_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16386'
      REDIS_PASSWORD: local-test-only
      NEXT_PUBLIC_SITE_URL: https://xylxf.xyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: bash -n scripts/deploy-release.sh scripts/verify-release-backup.sh scripts/prepare-standalone-release.sh scripts/deploy-ssh.sh scripts/deploy-remote.sh scripts/deploy-transport.sh scripts/prepare-release-directory.sh tests/deploy-release.test.sh tests/deploy-transport.test.sh
      - run: node --test tests/standalone-release.test.mjs tests/prune-releases.test.mjs
      - run: bash tests/deploy-transport.test.sh
      - run: node --test tests/deploy-ssh.integration.test.mjs
      - run: bash tests/deploy-release.test.sh
      - name: Bootstrap private Node 24 from a Node 20 server
        run: docker run --rm -v "$PWD:/work:ro" -w /work node:20.20.0-bookworm-slim bash tests/deploy-release.test.sh
      - run: pnpm exec prisma generate
      - run: docker compose -p blog-optimization-test -f tests/compose.yaml up -d --wait
      - run: pnpm exec prisma migrate deploy
      - run: node --test tests/deployment-db.test.mjs
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Verify standalone release and production deployment tools
        run: bash scripts/prepare-standalone-release.sh 0123456789012345678901234567890123456789-1-1
      - name: Verify relocated standalone against isolated services
        run: node tests/standalone-smoke.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results
      - run: docker compose -p blog-optimization-test -f tests/compose.yaml down -v
        if: always()

