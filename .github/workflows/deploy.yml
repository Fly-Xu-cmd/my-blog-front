name: Deploy Next.js App to Aliyun
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  DEPLOY_USER: appuser
  DEPLOY_PATH: /home/www/my-blog
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  BLOG_DEPLOY_NPM_REGISTRY: ${{ vars.BLOG_DEPLOY_NPM_REGISTRY || 'https://registry.npmmirror.com' }}
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build-and-deploy:
    needs: checks
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: blog-production-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.ALIYUN_SERVER_IP }}
      DEPLOY_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
      SSH_USER: appuser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm and build
        run: |
          npm install -g pnpm@12.3.4
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm build
          bash scripts/prepare-standalone-release.sh "$RELEASE_ID"
        env:
          DATABASE_URL: mysql://placeholder:placeholder@localhost:3306/placeholder
          NEXT_PUBLIC_SITE_URL: https://xylxf.xyz
          NEXT_PUBLIC_BASE_URL: http://${{ secrets.ALIYUN_SERVER_ADDRESS }}
      - name: Prepare a fresh release directory
        timeout-minutes: 3
        env:
          SSH_USER: root
        run: bash scripts/deploy-ssh.sh prepare-directories 120 "$DEPLOY_PATH" "$RELEASE_ID" < scripts/prepare-release-directory.sh
      - name: Upload release artifacts
        timeout-minutes: 12
        run: |
          set -eu
          source scripts/deploy-transport.sh
          ssh_ready
          printf -v ssh_command '%q ' ssh "${ssh_options[@]}" -p "${DEPLOY_PORT:-22}"
          bounded_transport upload-artifacts 600 rsync -aR --timeout=60 -e "$ssh_command" \
            ./standalone-release.tar.gz ./standalone-release.json \
            ./scripts/deploy-release.sh ./scripts/standalone-release.mjs \
            "$ssh_target:$DEPLOY_PATH/releases/$RELEASE_ID/"
      - name: Verify standalone release and inspect migration plan
        timeout-minutes: 8
        run: |
          bash scripts/deploy-ssh.sh prepare-release 360 "$DEPLOY_PATH" "$RELEASE_ID" "$BLOG_DEPLOY_NPM_REGISTRY" <<'REMOTE'
          export BLOG_DEPLOY_NPM_REGISTRY=$3
          bash "$1/releases/$2/scripts/deploy-release.sh" "$1" "$2" prepare
          REMOTE
      - name: Prepare dump client only for pending migrations
        timeout-minutes: 7
        env:
          SSH_USER: root
        run: |
          bash scripts/deploy-ssh.sh dump-client 300 "$DEPLOY_PATH" "$RELEASE_ID" <<'REMOTE'
          required=$(cat "$1/.deploy-state/$2/backup-required")
          case "$required" in
            no) echo 'No migration: dump client preparation skipped'; exit 0 ;;
            yes) ;;
            *) echo 'Invalid migration inspection result' >&2; exit 1 ;;
          esac
          if ! command -v mysqldump >/dev/null; then
            command -v apt-get >/dev/null || { echo 'Install a MySQL dump client for this distribution' >&2; exit 1; }
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends default-mysql-client
          fi
          REMOTE
      - name: Create backup only for pending migrations
        timeout-minutes: 18
        run: |
          bash scripts/deploy-ssh.sh backup 900 "$DEPLOY_PATH" "$RELEASE_ID" "$BLOG_DEPLOY_NPM_REGISTRY" <<'REMOTE'
          export BLOG_DEPLOY_NPM_REGISTRY=$3
          bash "$1/releases/$2/scripts/deploy-release.sh" "$1" "$2" backup
          REMOTE
      - name: Verify backup in an isolated CI database
        timeout-minutes: 20
        run: bash scripts/verify-release-backup.sh
      - name: Apply verified migrations, switch and check the release
        timeout-minutes: 13
        run: |
          bash scripts/deploy-ssh.sh activate 600 "$DEPLOY_PATH" "$RELEASE_ID" "$BLOG_DEPLOY_NPM_REGISTRY" <<'REMOTE'
          export BLOG_DEPLOY_NPM_REGISTRY=$3
          bash "$1/releases/$2/scripts/deploy-release.sh" "$1" "$2" activate
          REMOTE
