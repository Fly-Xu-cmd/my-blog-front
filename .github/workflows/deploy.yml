name: Deploy Next.js App to Aliyun
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  DEPLOY_USER: appuser
  DEPLOY_PATH: /home/www/my-blog
  UPLOAD_DIR: /home/www/uploads
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build-and-deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: blog-production-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm and build
        run: |
          npm install -g pnpm@12.3.4
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm build
        env:
          DATABASE_URL: mysql://placeholder:placeholder@localhost:3306/placeholder
          NEXT_PUBLIC_SITE_URL: https://xylxf.xyz
          NEXT_PUBLIC_BASE_URL: http://${{ secrets.ALIYUN_SERVER_ADDRESS }}
      - name: Prepare a fresh release directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: root
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            set -eu
            id appuser || useradd -m -s /bin/bash appuser
            test ! -e '${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}/node_modules'
            mkdir -p '${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}' '${{ env.UPLOAD_DIR }}'
            chown appuser:appuser '${{ env.DEPLOY_PATH }}'
            chown -R appuser:appuser '${{ env.DEPLOY_PATH }}/releases' '${{ env.UPLOAD_DIR }}'
      - name: Upload release artifacts
        env:
          DEPLOY_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          set -eu
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          rsync -azR -e "ssh -i $key_file -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' --exclude '.next/cache' --exclude '.env*' \
            ./.next ./package.json ./pnpm-lock.yaml ./pnpm-workspace.yaml \
            ./ecosystem.config.cjs ./next.config.mjs ./prisma ./public ./scripts/deploy-release.sh ./scripts/deployment-db.mjs \
            '${{ env.DEPLOY_USER }}@${{ secrets.ALIYUN_SERVER_IP }}:${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}/'
      - name: Prepare dependencies and inspect migration plan
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          command_timeout: 30m
          script: |
            bash '${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}/scripts/deploy-release.sh' \
              '${{ env.DEPLOY_PATH }}' '${{ env.RELEASE_ID }}' '${{ env.UPLOAD_DIR }}' prepare
      - name: Prepare dump client only for pending migrations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: root
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            set -eu
            required=$(cat '${{ env.DEPLOY_PATH }}/.deploy-state/${{ env.RELEASE_ID }}/backup-required')
            case "$required" in
              no) echo 'No migration: dump client preparation skipped'; exit 0 ;;
              yes) ;;
              *) echo 'Invalid migration inspection result' >&2; exit 1 ;;
            esac
            if ! command -v mysqldump >/dev/null; then
              command -v apt-get >/dev/null || { echo 'Install a MySQL dump client for this distribution' >&2; exit 1; }
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends default-mysql-client
            fi
      - name: Create backup only for pending migrations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          command_timeout: 30m
          script: |
            bash '${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}/scripts/deploy-release.sh' \
              '${{ env.DEPLOY_PATH }}' '${{ env.RELEASE_ID }}' '${{ env.UPLOAD_DIR }}' backup
      - name: Verify backup in an isolated CI database
        env:
          DEPLOY_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ALIYUN_SERVER_IP }}
        run: bash scripts/verify-release-backup.sh
      - name: Apply verified migrations, switch and check the release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          command_timeout: 30m
          script: |
            bash '${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}/scripts/deploy-release.sh' \
              '${{ env.DEPLOY_PATH }}' '${{ env.RELEASE_ID }}' '${{ env.UPLOAD_DIR }}' activate
