name: Deploy Next.js App to Aliyun

on:
  push:
    branches:
      - main

env:
  DEPLOY_USER: appuser
  DEPLOY_PATH: /home/www/my-blog
  UPLOAD_DIR: /home/www/uploads

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build-and-deploy:
    needs: checks
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Verify migration and paired admin readiness
        env:
          BACKUP_RESTORE_VERIFIED: ${{ vars.BLOG_BACKUP_RESTORE_VERIFIED }}
          ADMIN_READY: ${{ vars.BLOG_ADMIN_COMPAT_READY }}
        run: |
          test "$BACKUP_RESTORE_VERIFIED" = "202611160001_blog_optimization"
          test "$ADMIN_READY" = "true"

      - name: 🧱 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔧 Generate Prisma client
        run: pnpm exec prisma generate
        env:
          # 只要 schema.prisma 不需要连接真实 DB，这里可以用假的 URL
          DATABASE_URL: 'mysql://placeholder:placeholder@localhost:3306/placeholder'

      - name: 🏗️ Build Next.js project
        run: pnpm build
        env:
          # SEO（canonical/sitemap/OG）使用的正式站点域名
          NEXT_PUBLIC_SITE_URL: https://xylxf.xyz
          NEXT_PUBLIC_BASE_URL: http://${{ secrets.ALIYUN_SERVER_ADDRESS }}

      # ----------------------------------------------------------------
      # 优化点 1: 准备阶段，不进行复制，直接在传输阶段处理
      # ----------------------------------------------------------------

      - name: ✨ Ensure appuser exists & directories ready (root)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: root
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            id appuser || useradd -m -s /bin/bash appuser
            mkdir -p ${{ env.DEPLOY_PATH }}
            mkdir -p ${{ env.UPLOAD_DIR }}
            chown -R appuser:appuser ${{ env.DEPLOY_PATH }}
            chown -R appuser:appuser ${{ env.UPLOAD_DIR }}

      # ----------------------------------------------------------------
      # 优化点 2: 使用 rsync 替代 scp-action (解决 137 内存溢出)
      # ----------------------------------------------------------------
      - name: 📤 Sync files via Rsync
        run: |
          # 1. 设置 SSH 私钥
          echo "${{ secrets.ALIYUN_SSH_KEY }}" > private_key
          chmod 600 private_key

          # 2. 准备需要排除的文件列表 (减少传输体积)
          # .next/cache 非常大且非必须，建议排除

          # 3. 执行 Rsync 增量传输
          # -a: 归档模式 (保留权限、时间等)
          # -v: 显示过程
          # -z: 压缩传输
          # --delete: 删除目标目录中源目录没有的文件 (保持同步)
          # --exclude: 排除不需要上传的大文件

          rsync -avz --delete \
            -e "ssh -i private_key -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            --exclude '.env*' \
            ./.next ./package.json ./pnpm-lock.yaml ./pnpm-workspace.yaml ./ecosystem.config.cjs ./prisma ./public \
            ${{ env.DEPLOY_USER }}@${{ secrets.ALIYUN_SERVER_IP }}:${{ env.DEPLOY_PATH }}/tmp-deploy

          # 清理私钥
          rm private_key

      # ----------------------------------------------------------------
      # 优化点 3: 部署逻辑优化
      # ----------------------------------------------------------------
      - name: 🚀 Deploy application with PM2 (appuser)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          # 1. 必须加：延长超时时间到 30分钟 (解决 Run Command Timeout)
          command_timeout: 30m
          script: |
            set -eu
            cd ${{ env.DEPLOY_PATH }}

            # 发布前服务器需准备 Node 24；工具安装不修改系统全局 pnpm。
            test "$(node -p "process.versions.node.split('.')[0]")" = "24"
            PNPM_VERSION=$(node -p "require('./tmp-deploy/package.json').packageManager.split('@')[1]")
            test "$PNPM_VERSION" = "12.3.4"
            npm install --prefix "$HOME/.local/share/blog-tools" --no-save --package-lock=false \
              "pnpm@$PNPM_VERSION" --registry=https://registry.npmmirror.com
            export PATH="$HOME/.local/share/blog-tools/node_modules/.bin:$PATH"
            test "$(pnpm --version)" = "$PNPM_VERSION"

            echo "📦 Update files from tmp-deploy"
            rsync -a tmp-deploy/ .
            rm -rf tmp-deploy

            echo "� Setting up upload directory"
            # 确保上传目录存在
            mkdir -p ${{ env.UPLOAD_DIR }}

            echo "📦 Installing production deps"
            CI=true pnpm install --prod --frozen-lockfile --ignore-scripts \
              --registry=https://registry.npmmirror.com

            echo "🔧 Prisma & Database"
            # 既然目录下已有 .env，Prisma 会自动读取它，不需要额外配置 export
            pnpm exec prisma generate
            pnpm exec prisma migrate deploy

            echo "🔥 Reloading PM2"
            # 仅更新 PATH 无法替换 PM2 保存的旧 pnpm / Node 绝对入口。
            # 首次迁移入口不符时重建本应用；后续通过明确配置重载。
            test -x "$(node -p "require('./ecosystem.config.cjs').apps[0].script")"
            pm2 ping > /dev/null
            pm2 jlist > .pm2-current.json
            PM2_ACTION=$(node -e '
              const fs = require("node:fs");
              const target = require("./ecosystem.config.cjs").apps[0];
              const apps = JSON.parse(fs.readFileSync(".pm2-current.json", "utf8"));
              const matches = apps.filter(app => app.name === target.name);
              const sameEntry = matches.every(app =>
                app.pm2_env.pm_exec_path === target.script &&
                app.pm2_env.exec_interpreter === target.interpreter
              );
              process.stdout.write(sameEntry ? "keep" : "replace");
            ')
            rm .pm2-current.json
            if [ "$PM2_ACTION" = "replace" ]; then
              pm2 delete my-blog
            fi
            pm2 startOrReload ecosystem.config.cjs --only my-blog --update-env

            echo "🎉 Deployment Success!"
